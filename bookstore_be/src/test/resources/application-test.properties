# Test profile configuration (defaults to H2 in-memory MySQL mode; override via env vars for external DB)
spring.cache.type=none
spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:bookstore_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${TEST_JPA_DDL_AUTO:create-drop}
spring.jpa.show-sql=false

app.jwt.secret=${TEST_JWT_SECRET:your_test_jwt_secret_key_here_minimum_64_characters_for_ci_test_only_2026}
app.jwt.expiration-ms=86400000

vnpay.tmn-code=${TEST_VNPAY_TMN_CODE:your_test_vnpay_tmn}
vnpay.hash-secret=${TEST_VNPAY_HASH_SECRET:your_test_vnpay_hash_secret}
vnpay.api-url=${TEST_VNPAY_API_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${TEST_VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-callback}
