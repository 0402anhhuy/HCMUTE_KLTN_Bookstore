# Test profile configuration (override via environment variables in CI or local)
spring.cache.type=none
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/bookstore_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${TEST_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

app.jwt.secret=${TEST_JWT_SECRET:your_test_jwt_secret_key_here_minimum_64_characters_for_ci_test_only_2026}
app.jwt.expiration-ms=86400000
