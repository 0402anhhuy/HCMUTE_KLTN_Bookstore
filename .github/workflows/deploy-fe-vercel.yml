name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'bookstore_fe/**' # Chỉ kích hoạt khi có thay đổi trong thư mục bookstore_fe
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub khi cần

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'bookstore_fe/package-lock.json'

      - name: 3. Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 4. Pull Vercel Environment Information
        working-directory: ./bookstore_fe
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 5. Build Project Artifacts
        working-directory: ./bookstore_fe
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 6. Deploy to Vercel (Production)
        working-directory: ./bookstore_fe
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
