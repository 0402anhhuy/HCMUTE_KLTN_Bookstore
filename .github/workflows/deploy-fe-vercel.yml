name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'bookstore_fe/**' # Chỉ kích hoạt khi có thay đổi trong thư mục bookstore_fe
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub khi cần

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'bookstore_fe/package-lock.json'

      - name: 3. Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 4. Pull Vercel Environment Information
        working-directory: ./bookstore_fe
        run: |
          export VERCEL_ORG_ID=$(echo "${{ secrets.VERCEL_ORG_ID }}" | tr -d '\r\n[:space:]')
          export VERCEL_PROJECT_ID=$(echo "${{ secrets.VERCEL_PROJECT_ID }}" | tr -d '\r\n[:space:]')
          export VERCEL_TOKEN=$(echo "${{ secrets.VERCEL_TOKEN }}" | tr -d '\r\n[:space:]')
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: 5. Build Project Artifacts
        working-directory: ./bookstore_fe
        run: |
          export VERCEL_ORG_ID=$(echo "${{ secrets.VERCEL_ORG_ID }}" | tr -d '\r\n[:space:]')
          export VERCEL_PROJECT_ID=$(echo "${{ secrets.VERCEL_PROJECT_ID }}" | tr -d '\r\n[:space:]')
          export VERCEL_TOKEN=$(echo "${{ secrets.VERCEL_TOKEN }}" | tr -d '\r\n[:space:]')
          vercel build --prod --token=$VERCEL_TOKEN

      - name: 6. Deploy to Vercel (Production)
        working-directory: ./bookstore_fe
        run: |
          export VERCEL_ORG_ID=$(echo "${{ secrets.VERCEL_ORG_ID }}" | tr -d '\r\n[:space:]')
          export VERCEL_PROJECT_ID=$(echo "${{ secrets.VERCEL_PROJECT_ID }}" | tr -d '\r\n[:space:]')
          export VERCEL_TOKEN=$(echo "${{ secrets.VERCEL_TOKEN }}" | tr -d '\r\n[:space:]')
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
