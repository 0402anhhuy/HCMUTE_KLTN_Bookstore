name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'bookstore_fe/**' # Chỉ kích hoạt khi có thay đổi trong thư mục bookstore_fe
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub khi cần

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'bookstore_fe/package-lock.json'

      - name: 3. Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 4. Configure Vercel Project & Deploy
        working-directory: ./bookstore_fe
        run: |
          ORG_ID=$(echo "${{ secrets.VERCEL_ORG_ID }}" | tr -d '\r\n[:space:]')
          PROJECT_ID=$(echo "${{ secrets.VERCEL_PROJECT_ID }}" | tr -d '\r\n[:space:]')
          TOKEN=$(echo "${{ secrets.VERCEL_TOKEN }}" | tr -d '\r\n[:space:]')
          
          mkdir -p .vercel
          echo "{\"projectId\":\"$PROJECT_ID\",\"orgId\":\"$ORG_ID\"}" > .vercel/project.json
          
          vercel pull --yes --environment=production --token=$TOKEN
          vercel build --prod --token=$TOKEN
          vercel deploy --prebuilt --prod --token=$TOKEN
